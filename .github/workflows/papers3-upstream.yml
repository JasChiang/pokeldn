name: PaperS3 upstream check

on:
  schedule:
    # Monday 02:23 UTC / 10:23 Asia/Taipei.
    - cron: '23 2 * * 1'
  workflow_dispatch:
    inputs:
      test_current:
        description: Also test current main when upstream has no new commits
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: papers3-upstream
  cancel-in-progress: false

jobs:
  prepare:
    # Standard hosted runners are free for public repositories. Never activate
    # this schedule in upstream or after changing the fork to private.
    if: github.repository == 'JasChiang/pokeldn' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      test_ref: ${{ steps.sync.outputs.test_ref }}
      pr: ${{ steps.sync.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare upstream merge and review PR
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TEST_CURRENT: ${{ inputs.test_current || false }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/Decryptu/pokeldn.git main
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          if git merge-base --is-ancestor "$upstream_sha" origin/main; then
            echo 'Upstream is already included; no PR or scheduled tests needed.' >> "$GITHUB_STEP_SUMMARY"
            if [[ "$TEST_CURRENT" == true ]]; then
              echo "test_ref=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          branch="automation/upstream-${upstream_sha:0:12}"
          pr="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch origin "$branch"
            git switch -c upstream-candidate FETCH_HEAD
            # Already reviewed/tested this upstream tip against this main.
            if [[ -n "$pr" ]] && git merge-base --is-ancestor origin/main HEAD; then
              echo "Existing update PR #$pr; no duplicate tests." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git merge --no-edit origin/main
          else
            git switch -c upstream-candidate origin/main
          fi
          # A conflict fails visibly and requires manual resolution. Never
          # discard the PaperS3 changes or force-update main.
          git merge --no-ff --no-edit "$upstream_sha"
          git push origin "HEAD:refs/heads/$branch"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "Merge upstream Decryptu/pokeldn main at $upstream_sha while retaining the PaperS3 variant."
            echo
            echo "Cloud validation: $run_url (DISPLAY tests and both PaperS3 builds)."
            echo
            echo 'This PR is not automatically merged. Builds do not establish physical screen, USB, power or Switch compatibility. No device flashing, keys, backups or Mac runner are involved.'
            echo
            echo 'Bot-created PR workflows may require GitHub approval; the tests linked above execute in this scheduled/manual workflow independently.'
          } > "$RUNNER_TEMP/upstream-pr.md"
          if [[ -z "$pr" ]]; then
            gh pr create --base main --head "$branch" --title "Sync upstream ${upstream_sha:0:12} into PaperS3 fork" --body-file "$RUNNER_TEMP/upstream-pr.md"
            pr="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number')"
          else
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/upstream-pr.md"
          fi
          echo "test_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "Prepared PR #$pr; cloud validation follows below." >> "$GITHUB_STEP_SUMMARY"

  display-tests:
    needs: prepare
    if: needs.prepare.outputs.test_ref != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.test_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e ./vendor/LDN pytest==9.1.1 pyserial==3.5 trio==0.33.0 pycryptodome==3.23.0 Pillow==12.0.0
      - name: Check DISPLAY protocol and native C parser
        run: python -m pytest tests/test_papers3_display_model.py tests/test_esp32_screen.py -q

  firmware:
    needs: prepare
    if: needs.prepare.outputs.test_ref != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        variant: [epaper, radio]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.test_ref }}
          persist-credentials: false
      - name: Build PaperS3 variant without flashing
        env:
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          set -eo pipefail
          . "$IDF_PATH/export.sh"
          if [[ "$VARIANT" == epaper ]]; then
            bash scripts/build_papers3_epaper.sh
          else
            export POKELDN_PAPERS3=1
            cd firmware/esp32
            idf.py -B build-papers3-radio -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.papers3' set-target esp32s3
            idf.py -B build-papers3-radio build
          fi

  report:
    needs: [prepare, display-tests, firmware]
    if: always() && needs.prepare.outputs.pr != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      pull-requests: write
    steps:
      - name: Attach validation results to the update PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.prepare.outputs.pr }}
          DISPLAY_RESULT: ${{ needs.display-tests.result }}
          FIRMWARE_RESULT: ${{ needs.firmware.result }}
        shell: bash
        run: |
          {
            echo "DISPLAY tests: $DISPLAY_RESULT"
            echo "PaperS3 e-paper + radio builds: $FIRMWARE_RESULT"
            echo
            echo "Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo 'Physical hardware and Switch tests remain separate. Manual review is required before merging or flashing.'
          } > "$RUNNER_TEMP/results.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/results.md"
